<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkwazi | Portfolio of Evidence</title>
    <meta name="description" content="Portfolio of Evidence for 6-week practical field guide training at Inkwazi.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    
    <!-- Marked for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for XSS Sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#dashboard" class="brand-link" id="brand-link">
                    <span class="brand-badge">Field Guide POE</span>
                    <h1 class="brand-title">INKWAZI</h1>
                    <p class="brand-subtitle">6-Week Practical Training</p>
                </a>
                <button class="mobile-close-btn" id="mobile-close-btn" aria-label="Close navigation">&times;</button>
            </div>

            <div class="sidebar-search">
                <input type="text" id="nav-search-input" placeholder="Quick find topic..." aria-label="Quick search navigation">
            </div>

            <nav class="nav-container" id="nav-container">
                <!-- Navigation dynamically generated in app.js -->
            </nav>

            <div class="sidebar-footer">
                <div class="footer-meta">
                    <span class="pulse-dot"></span> Portfolio of Evidence
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Top App Bar -->
            <header class="topbar">
                <button class="menu-toggle-btn" id="menu-toggle-btn" aria-label="Open menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <div class="breadcrumbs" id="breadcrumbs">
                    <span class="crumb root">Portfolio</span>
                    <span class="crumb-separator">/</span>
                    <span class="crumb current" id="current-crumb">Overview</span>
                </div>

                <div class="topbar-actions">
                    <button class="action-btn print-btn" id="print-btn" title="Print this page or save as PDF">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 6 2 18 2 18 9"></polyline>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                            <rect x="6" y="14" width="12" height="8"></rect>
                        </svg>
                        <span>Print</span>
                    </button>
                </div>
            </header>

            <!-- Main Reading Canvas -->
            <main class="content-canvas">
                <div class="content-card">
                    <div id="loader" class="loader-container">
                        <div class="spinner"></div>
                        <p class="loader-text">Loading evidence...</p>
                    </div>

                    <article id="content" class="markdown-body"></article>

                    <!-- Linear Navigation Footer -->
                    <footer class="pagination-footer" id="pagination-footer">
                        <a href="#" class="pager-btn prev" id="pager-prev">
                            <span class="pager-label">← Previous Topic</span>
                            <span class="pager-title" id="pager-prev-title"></span>
                        </a>
                        <a href="#" class="pager-btn next" id="pager-next">
                            <span class="pager-label">Next Topic →</span>
                            <span class="pager-title" id="pager-next-title"></span>
                        </a>
                    </footer>
                </div>
            </main>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div class="lightbox-modal" id="lightbox-modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightbox-close" aria-label="Close image preview">&times;</button>
            <img class="lightbox-img" id="lightbox-img" src="" alt="Enlarged diagram preview">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
