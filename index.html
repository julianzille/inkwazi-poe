<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkwazi Field Guide</title>
    <meta name="description" content="A comprehensive field guide covering wildlife, flora, and wilderness skills.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Marked for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>Inkwazi</h1>
                <p>Portfolio of Evidence</p>
            </div>
            <ul class="nav-links" id="nav-links">
                <!-- Nav links will be injected by JavaScript -->
            </ul>
            <div class="sidebar-footer">
                <p>Julian Zille</p>
            </div>
        </nav>
        
        <main class="content-area">
            <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            
            <div class="glass-panel">
                <div id="loader" class="loader">
                    <div class="spinner"></div>
                </div>
                <article id="content" class="markdown-body hidden"></article>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
